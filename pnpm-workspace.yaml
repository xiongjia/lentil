packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@nestjs/core": true
  "@parcel/watcher": true
  "@scarf/scarf": true
  "@swc/core": true
  esbuild: true
  unrs-resolver: true

catalog:
  # React
  react: ^19.2.0
  react-dom: ^19.2.0
  "@types/react": ^19.2.2
  "@types/react-dom": ^19.2.2

  # Vite
  vite: ^6.3.5
  "@vitejs/plugin-react": ^4.5.0

  # Tailwind CSS
  tailwindcss: ^4.2.4
  "@tailwindcss/postcss": ^4.2.4
  postcss: ^8.5.3

  # Testing (frontend)
  vitest: ^3.0.0
  "@testing-library/react": ^16.0.0
  "@testing-library/jest-dom": ^6.9.1
  jsdom: ^26.1.0

  # Testing (backend)
  jest: ^30.3.0
  "@jest/globals": ^30.3.0
  "@types/jest": ^30.0.0
  ts-jest: ^29.4.9

  # Shared utilities
  clsx: ^2.1.1
  lucide-react: ^1.16.0
  tailwind-merge: ^3.2.0
  "@tanstack/react-table": ^8.21.3

  # Tooling
  typescript: ^5.9.2
  eslint: ^9.39.1
  "@types/node": ^22.15.3
  prettier: ^3.7.4
  turbo: ^2.9.18

  # NestJS
  "@nestjs/common": ^11
  "@nestjs/config": "4"
  "@nestjs/core": ^11
  "@nestjs/platform-express": ^11
  "@nestjs/swagger": ^11
  "@nestjs/cli": ^10.4.9
  "@nestjs/schematics": ^10.2.3
  "@nestjs/testing": ^11.1.19

  # ORM
  "@mikro-orm/core": ^6.6.14
  "@mikro-orm/libsql": ^6.6.14
  "@mikro-orm/migrations": ^6.6.14
  "@mikro-orm/nestjs": ^6.1.2
  "@mikro-orm/postgresql": ^6.6.14
  "@mikro-orm/reflection": ^6.6.14
  "@mikro-orm/cli": ^6.6.14
  pg: ^8.21.0

  # RPC
  "@orpc/server": ^1.0.0
  "@orpc/client": ^1.0.0
  "@orpc/contract": ^1.0.0
  "@orpc/nest": ^1.0.0
  "@orpc/openapi": ^1.14.6
  "@orpc/openapi-client": ^1.0.0
  "@orpc/react": ^1.0.0
  "@orpc/zod": ^1.14.6
  zod: ^4.0.0

  # Build tools
  tsup: ^8.0.0

minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.9.18"
  - "@turbo/darwin-arm64@2.9.18"
  - "@turbo/linux-64@2.9.18"
  - "@turbo/linux-arm64@2.9.18"
  - "@turbo/windows-64@2.9.18"
  - "@turbo/windows-arm64@2.9.18"
  - turbo@2.9.18
