packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@nestjs/core": true
  "@parcel/watcher": true
  "@scarf/scarf": true
  esbuild: true
  unrs-resolver: true

catalog:
  # React
  react: ^19.2.0
  react-dom: ^19.2.0
  "@types/react": ^19.2.2
  "@types/react-dom": ^19.2.2

  # Vite
  vite: ^6.3.5
  "@vitejs/plugin-react": ^4.5.0

  # Tailwind CSS
  tailwindcss: ^4.2.4
  "@tailwindcss/postcss": ^4.2.4
  postcss: ^8.5.3

  # Testing (frontend)
  vitest: ^3.0.0
  "@testing-library/react": ^16.0.0
  "@testing-library/jest-dom": ^6.9.1
  jsdom: ^26.1.0

  # Testing (backend)
  jest: ^30.3.0
  "@jest/globals": ^30.3.0
  "@types/jest": ^30.0.0
  ts-jest: ^29.4.9

  # Shared utilities
  clsx: ^2.1.1
  lucide-react: ^1.16.0
  tailwind-merge: ^3.2.0
  "@tanstack/react-table": ^8.21.3

  # Tooling
  typescript: ^5.9.2
  eslint: ^9.39.1
  "@types/node": ^22.15.3
  prettier: ^3.7.4
  turbo: ^2.9.18

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.9.18'
  - '@turbo/darwin-arm64@2.9.18'
  - '@turbo/linux-64@2.9.18'
  - '@turbo/linux-arm64@2.9.18'
  - '@turbo/windows-64@2.9.18'
  - '@turbo/windows-arm64@2.9.18'
  - turbo@2.9.18
